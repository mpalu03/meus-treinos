<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ÁXIS</title>
<meta name="description" content="Ficha de treino com registro de cargas, descanso e evolução em PDF.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ÁXIS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141715" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Jost"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/jost-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Jost"; font-style: normal; font-weight: 500; font-display: swap; src: url("fonts/jost-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Jost"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/jost-latin-600-normal.woff2") format("woff2"); }
/* ÁXIS: creme, verde-sálvia e filete dourado, como no logo; serifa clássica para nome e títulos, sans geométrica espaçada para rótulos */
:root {
  /* Layout: coluna única para celular, abas fixas embaixo; cada treino mantém a sua cor (A rosé, B ocre, C sálvia, D terracota) em tons suaves */
  --bg: #f6f3ee;
  --surface: #fffdf9;
  --surface-2: #f1ece4;
  --ink: #2e3631;
  --muted: #747b75;
  --line: #e3dcd0;
  --accent: #5f6d63;
  --accent-ink: #fffdf9;
  --gold: #b49a6a;
  --gold-soft: #f2e9d8;
  --gold-ink: #7f6738;
  --good: #4f8560;
  --bad: #b4513e;
  --tA: #b76e7c; --tA-soft: #f5e5e8; --tA-on: #ffffff;
  --tB: #a98536; --tB-soft: #f4ead3; --tB-on: #ffffff;
  --tC: #5e8c6a; --tC-soft: #e2eee4; --tC-on: #ffffff;
  --tD: #bf7650; --tD-soft: #f6e6dc; --tD-on: #ffffff;
  --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --font-body: "Jost", "Futura", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Jost", "Futura", system-ui, -apple-system, sans-serif;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141715; --surface: #1c201d; --surface-2: #242925; --ink: #ece7dd; --muted: #a0a59e; --line: #333a34;
    --accent: #a9b8ab; --accent-ink: #141715; --gold: #cdb282; --gold-soft: #3a3223; --gold-ink: #e3cb9b; --good: #7dba8c; --bad: #e3846f;
    --tA: #e3a0ac; --tA-soft: #3a2529; --tA-on: #2a1015;
    --tB: #d9b871; --tB-soft: #383020; --tB-on: #241a06;
    --tC: #8fc09b; --tC-soft: #1f3125; --tC-on: #0e2014;
    --tD: #e6a07c; --tD-soft: #3b2a20; --tD-on: #2b1408;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141715; --surface: #1c201d; --surface-2: #242925; --ink: #ece7dd; --muted: #a0a59e; --line: #333a34;
  --accent: #a9b8ab; --accent-ink: #141715; --gold: #cdb282; --gold-soft: #3a3223; --gold-ink: #e3cb9b; --good: #7dba8c; --bad: #e3846f;
  --tA: #e3a0ac; --tA-soft: #3a2529; --tA-on: #2a1015;
  --tB: #d9b871; --tB-soft: #383020; --tB-on: #241a06;
  --tC: #8fc09b; --tC-soft: #1f3125; --tC-on: #0e2014;
  --tD: #e6a07c; --tD-soft: #3b2a20; --tD-on: #2b1408;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
button { font: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app { max-width: 640px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom)); }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; white-space: nowrap; }
.sync { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-align: right; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync.cloud .dot { background: var(--good); }
.sync.local .dot { background: var(--tB); }
.sync.warn .dot { background: var(--bad); }

.row { display: flex; align-items: center; }
.gap { gap: 10px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.end { justify-content: flex-end; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
p { margin: 0; }

h3.sec { font-family: var(--font-display); text-transform: uppercase; font-size: 16px; letter-spacing: .07em; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }

/* Treino chips */
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 4px 7px; text-align: center; cursor: pointer; color: var(--ink); min-width: 0; }
.chip .l { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; color: var(--t); display: block; }
.chip .n { font-size: 11.5px; color: var(--muted); line-height: 1.2; margin-top: 3px; display: block; overflow-wrap: anywhere; }
.chip[aria-pressed="true"] { background: var(--t-soft); border-color: var(--t); }
.chip[aria-pressed="true"] .n { color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.thead { display: flex; align-items: center; gap: 12px; border-left: 6px solid var(--t); }
.thead .big { font-family: var(--font-display); font-size: 46px; font-weight: 700; line-height: .9; color: var(--t); width: 36px; text-align: center; flex: none; }
.thead h2 { font-family: var(--font-display); font-size: 25px; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; text-wrap: balance; }
.thead p { margin-top: 3px; color: var(--muted); font-size: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--t-soft); color: var(--ink); white-space: nowrap; border: 1px solid var(--t); }

/* Buttons */
.btn { font-weight: 600; border-radius: 12px; padding: 10px 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.block { width: 100%; }
.btn.big { font-family: var(--font-display); font-size: 21px; text-transform: uppercase; letter-spacing: .04em; min-height: 54px; }
.btn.danger { color: var(--bad); }
.btn.dangerfill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Exercise list (read only) */
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.exrow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.ord { font-family: var(--font-display); font-weight: 700; font-size: 15px; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 8px; background: var(--t-soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.exname { font-weight: 600; line-height: 1.25; }
.presc { font-family: var(--font-display); font-size: 17px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
.obs { font-size: 13px; color: var(--muted); margin-top: 3px; }
.last { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.last b { font-family: var(--font-display); font-size: 21px; font-weight: 600; display: block; line-height: 1.1; }
.last small { display: block; color: var(--muted); font-size: 12px; }

/* Session */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding: 6px 0 10px; display: flex; flex-direction: column; gap: 8px; }
.kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--t); }
.dtitle { font-family: var(--font-display); font-size: 24px; margin: 0; font-weight: 600; text-transform: uppercase; line-height: 1.05; }
.datef { width: 150px; flex: none; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--t); transition: width .25s; }
.excard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.excard.done { border-color: var(--t); box-shadow: inset 5px 0 0 var(--t); }
.exhead { display: flex; gap: 10px; align-items: flex-start; }
.load { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 22px; font-weight: 600; color: var(--ink); cursor: pointer; flex: none; }
.cinput { width: 92px; height: 44px; text-align: center; font-family: var(--font-display); font-size: 25px; font-weight: 600; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; padding: 0 4px; }
.cinput::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.cinput.bad { border-color: var(--bad); }
.unit { color: var(--muted); font-weight: 600; }
.lastnote { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.sets { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.sets .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 2px; }
.setdot { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--muted); cursor: pointer; }
.setdot[aria-pressed="true"] { background: var(--t); border-color: var(--t); color: var(--t-on); }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.input { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 42px; width: 100%; }
select.input { padding-right: 6px; }

/* History */
.sumgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 2px; }
.stat small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.stat b { font-family: var(--font-display); font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; display: block; }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.hrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; background: none; border: 0; color: var(--ink); text-align: left; cursor: pointer; }
.hl { font-family: var(--font-display); font-weight: 700; font-size: 20px; width: 36px; height: 36px; border-radius: 10px; background: var(--t); color: var(--t-on); display: flex; align-items: center; justify-content: center; flex: none; }
.hrow b { display: block; font-weight: 600; }
.hrow small { color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); font-size: 20px; transition: transform .2s; }
.hrow[aria-expanded="true"] .chev { transform: rotate(90deg); }
.hbody { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.t td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t .n { text-align: right; white-space: nowrap; }
.tscroll { overflow-x: auto; }

/* Evolution */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.up { color: var(--good); }
.down { color: var(--bad); }
.chart { width: 100%; min-height: 200px; margin-top: 6px; }
.chart svg { display: block; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-lbl { fill: var(--muted); font-size: 12px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.c-area { fill: var(--t); opacity: .13; }
.c-line { stroke: var(--t); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.c-pt { fill: var(--t); }
.c-last { fill: var(--t); stroke: var(--surface); stroke-width: 2.5; }
.c-val { fill: var(--ink); font-weight: 700; font-size: 13px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.srow { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); text-align: left; cursor: pointer; }
.srow[aria-pressed="true"] { border-color: var(--t); background: var(--t-soft); }
.srow small { display: block; color: var(--muted); font-size: 12.5px; }
.sval { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sval b { font-family: var(--font-display); font-size: 19px; font-weight: 600; display: block; line-height: 1.1; }
.sval small { font-weight: 700; }
.spark .c-line { stroke-width: 2; }
.hint { font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.empty { text-align: center; padding: 26px 18px; }
.empty h2 { font-family: var(--font-display); text-transform: uppercase; font-size: 23px; margin: 0 0 6px; font-weight: 600; }
.empty p { color: var(--muted); max-width: 40ch; margin: 0 auto 14px; }

/* Ficha editor */
.edrow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border-left: 5px solid var(--t); }
.edgrid { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.edgrid .full { grid-column: 1 / -1; }
.edgrid3 { display: grid; grid-template-columns: minmax(0, 1fr) 116px 112px; gap: 8px; grid-column: 1 / -1; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

/* Nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
nav.tabs .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 5px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; }
nav.tabs a svg { width: 23px; height: 23px; }
nav.tabs a[aria-current="page"] { color: var(--accent); background: var(--surface-2); }
nav.tabs .badge { position: absolute; top: 4px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }

/* Rest timer */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 30; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
.timer .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; opacity: .75; }
.timer .tt { font-family: var(--font-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 54px; }
.timer button { border: 0; border-radius: 999px; height: 38px; min-width: 38px; padding: 0 12px; background: color-mix(in srgb, var(--bg) 18%, transparent); color: inherit; font-weight: 700; cursor: pointer; }
.timer.over { background: var(--good); color: #fff; animation: pulse .7s ease-in-out 4; }
@keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.07); } }
.linkbtn { background: none; border: 0; padding: 2px 0; min-height: 32px; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; align-self: flex-start; text-decoration: underline; text-underline-offset: 3px; }
.psets { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.pset { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 8px 6px 10px; }
.plbl { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.cinput.sm { width: 100%; max-width: 96px; height: 42px; font-size: 22px; }
.pnote { font-size: 12.5px; color: var(--muted); gap: 10px; align-items: flex-end; }

/* Modal + toast */
.modal { position: fixed; inset: 0; background: rgba(8, 10, 14, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.modal .box { background: var(--surface); color: var(--ink); border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.modal .box.vbox { max-width: 560px; max-height: calc(100% - 8px); overflow-y: auto; gap: 12px; }
.vframe { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
.vframe.tall { width: auto; height: min(60vh, 520px); aspect-ratio: 9 / 16; margin: 0 auto; }
.vframe iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
video.own { display: block; width: 100%; max-height: 60vh; border-radius: 12px; background: #000; }
.vidbtn { display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 32px; white-space: nowrap; flex: none; }
.vidbtn.has { background: var(--t-soft); border-color: var(--t); }
.exrow .vidbtn { margin-top: 7px; }
.vbox a.small { color: var(--accent); font-weight: 600; align-self: flex-start; }
.ntfy { background: var(--surface-2); border-radius: 14px; padding: 12px; gap: 8px; }
.ntfy ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.topic { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; user-select: all; }
.vsec { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }

<script>
(() => {
'use strict';
const LOCAL_ONLY = true;

/* ---------- Ficha original (transcrita da ficha da academia) ---------- */
const DROP = 'Drop: após as 10, reduza a carga e faça mais 10 sem descanso';
function defaultPlan() {
  const ex = (id, ordem, nome, reps, extra = {}) => Object.assign({ id, ordem, nome, reps, series: null, unidade: 'kg', obs: '' }, extra);
  return {
    versao: 2,
    seriesPadrao: 3,
    metaSemanal: 4,
    treinos: [
      { id: 'A', nome: 'Peito + Tríceps', exercicios: [
        ex('A1', '1', 'Cross over alto', '10', { obs: 'Execução lenta (slow)' }),
        ex('A2', '2', 'Supino declinado', '10'),
        ex('A3', '3', 'Supino reto com halter', '10 (2"60)', { obs: 'Confirmar com o professor o que significa (2"60)' }),
        ex('A4', '4', 'Pullover', '10'),
        ex('A5', '5', 'Tríceps francês com halter', '10'),
        ex('A6', '6', 'Tríceps testa', '10'),
        ex('A7', '7', 'Tríceps polia com corda', '10 + drop', { obs: 'Drop: após as 10, reduza a carga e continue sem descanso' })
      ]},
      { id: 'B', nome: 'Pernas', exercicios: [
        ex('B1', '1', 'Agachamento hack', '10'),
        ex('B2', '2', 'Leg press 45°', '10'),
        ex('B3', '3', 'Elevação de quadril', '10'),
        ex('B4', '4', 'Stiff com halter', '10'),
        ex('B5', '5', 'Cadeira extensora', '10 drop 10', { obs: DROP }),
        ex('B6', '6', 'Mesa flexora (flexor horizontal)', '10 drop 10', { obs: DROP }),
        ex('B7', '7', 'Panturrilha na máquina', '15'),
        ex('B8', 'Core', 'Prancha', '1 min', { unidade: 's', obs: 'Registre o tempo em segundos' })
      ]},
      { id: 'C', nome: 'Ombros', exercicios: [
        ex('C1', '1', 'Elevação lateral', '10'),
        ex('C2', '2', 'Remada alta', '10 drop 10', { obs: DROP }),
        ex('C3', '3', 'Desenvolvimento na máquina', '10'),
        ex('C4', '4', 'Elevação frontal na polia', '10 drop 10', { obs: DROP }),
        ex('C5', '5', 'Crucifixo inverso na máquina', '10'),
        ex('C6', '6', 'Encolhimento', '10')
      ]},
      { id: 'D', nome: 'Costas + Bíceps', exercicios: [
        ex('D1', '1', 'Puxada frente', '10', { obs: 'Puxada frente e fechada estão as duas como 1º na ficha: confirmar com o professor' }),
        ex('D2', '1', 'Puxada fechada', '10', { obs: 'Puxada frente e fechada estão as duas como 1º na ficha: confirmar com o professor' }),
        ex('D3', '2', 'Puxada baixa', '10'),
        ex('D4', '3', 'Pull down com corda', '10'),
        ex('D5', '4', 'Remada serrote', '10'),
        ex('D6', '5', 'Rosca Scott com halter', '10'),
        ex('D7', '6', 'Rosca direta 21', '21', { obs: 'Método 21: 7 parciais embaixo + 7 parciais em cima + 7 completas' }),
        ex('D8', '7', 'Rosca alternada', '10'),
        ex('D9', 'Core', 'Lombar com peso', '15')
      ]}
    ]
  };
}
const PDF_RGB = { A: [183, 110, 124], B: [169, 133, 54], C: [94, 140, 106], D: [191, 118, 80] };
const PDF_SAGE = [95, 109, 99], PDF_GOLD = [180, 154, 106];

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const parseISO = s => { const [y, m, d] = String(s || '').split('-').map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const fmtDM = s => { const d = parseISO(s); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}`; };
const fmtDMY = s => { const d = parseISO(s); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtDia = s => `${DIAS[parseISO(s).getDay()]}, ${fmtDM(s)}`;
const nf = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
const nfIn = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2, useGrouping: false });
const fmtNum = v => (v == null || Number.isNaN(v)) ? '—' : nf.format(v);
const unitLabel = u => u === 's' ? 's' : u === 'reps' ? 'reps' : 'kg';
const fmtCarga = (v, u) => v == null ? '—' : `${nf.format(v)} ${unitLabel(u)}`;
const fmtSets = arr => arr.map(v => v == null ? '–' : nf.format(v)).join(' / ');
function parseNum(s) {
  if (s == null) return null;
  let t = String(s).trim().replace(/\s/g, '');
  if (t === '') return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  const v = Number(t);
  return Number.isFinite(v) && v >= 0 ? Math.round(v * 100) / 100 : NaN;
}

const SAFE_ID = /^[A-Za-z0-9_\-.~:@+]{1,120}$/;

const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);

const LS = {
  get(k, d) { try { const v = localStorage.getItem('mt:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { if (v == null) localStorage.removeItem('mt:' + k); else localStorage.setItem('mt:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

function normalizePlan(p) {
  if (!validPlan(p)) return defaultPlan();
  p = clone(p);
  const legacy = p.seriesPadrao == null;
  p.seriesPadrao = Math.max(1, Math.min(12, parseInt(legacy ? 3 : p.seriesPadrao, 10) || 3));
  p.metaSemanal = Math.max(1, Math.min(7, parseInt(p.metaSemanal, 10) || 4));
  for (const t of p.treinos) {
    t.exercicios = t.exercicios.filter(e => e && e.id);
    for (const e of t.exercicios) {
      if (e.reps == null) {
        const m = String(e.prescricao || '').match(/^\s*(\d+)\s*[×xX]\s*(.*)$/);
        e.reps = m ? m[2].trim() : String(e.prescricao || '').trim();
        if (m && e.series == null) e.series = +m[1];
      }
      delete e.prescricao;
      if (legacy && +e.series === 4) e.series = null;
      if (e.series != null) { const v = parseInt(e.series, 10); e.series = Number.isFinite(v) ? Math.max(0, Math.min(12, v)) : null; }
    }
  }
  p.versao = 2;
  return p;
}
function validPlan(p) {
  return p && Array.isArray(p.treinos) && p.treinos.length && p.treinos.every(t => t && typeof t.id === 'string' && Array.isArray(t.exercicios));
}

/* ---------- Estado ---------- */

const downloads = {
  async save({ filename, data }) {
    const type = filename.endsWith('.pdf') ? 'application/pdf' : 'application/json';
    const blob = data instanceof Blob ? data : new Blob([data], { type });
    let file = null;
    try { file = new File([blob], filename, { type }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.share) {
      let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        try { await navigator.share({ files: [file], title: filename }); return { status: 'saved' }; }
        catch (e) { if (e && e.name === 'AbortError') throw { code: 'declined' }; }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return { status: 'saved' };
  }
};

const treinoById = id => state.plan.treinos.find(t => t.id === id);
const nSeries = (e, plan = state.plan) => (e && e.series != null ? e.series : (plan && plan.seriesPadrao != null ? plan.seriesPadrao : 3));
const presc = (e, plan = state.plan) => { const n = nSeries(e, plan), r = String(e.reps || '').trim(); return r ? `${n} × ${r}` : `${n} ${n === 1 ? 'série' : 'séries'}`; };

function findEx(id) { for (const t of state.plan.treinos) { const e = t.exercicios.find(x => x.id === id); if (e) return { e, t }; } return null; }
function sortedSessions() {
  return state.sessions.slice().sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : (a.criadoEm || 0) - (b.criadoEm || 0));
}
function lastOf(exId, excludeId) {
  const ss = sortedSessions();
  for (let i = ss.length - 1; i >= 0; i--) {
    const s = ss[i]; if (s.id === excludeId) continue;
    const it = s.itens && s.itens[exId];
    if (it && it.carga != null) return { carga: it.carga, data: s.data, cargas: Array.isArray(it.cargas) ? it.cargas : null };
  }
  return null;
}
const lastSessionOf = tid => { const ss = sortedSessions().filter(s => s.treino === tid); return ss[ss.length - 1] || null; };
function suggested() {
  const ids = state.plan.treinos.map(t => t.id);
  const ss = sortedSessions();
  if (!ss.length) return ids[0];
  const i = ids.indexOf(ss[ss.length - 1].treino);
  return ids[(i + 1) % ids.length];
}
function seriesOf(exId) {
  return sortedSessions()
    .filter(s => s.itens && s.itens[exId] && s.itens[exId].carga != null)
    .map(s => ({ data: s.data, v: s.itens[exId].carga, feitas: s.itens[exId].feitas || 0, total: s.itens[exId].total || 0, cargas: Array.isArray(s.itens[exId].cargas) ? s.itens[exId].cargas : null, obs: s.itens[exId].obs || '', sid: s.id }));
}
function statsOf(pts) {
  if (!pts.length) return null;
  const first = pts[0].v, last = pts[pts.length - 1].v, max = Math.max(...pts.map(p => p.v));
  const pct = first > 0 ? (last - first) / first * 100 : null;
  const pctText = pct == null ? '—' : `${pct > 0 ? '+' : ''}${nf.format(Math.round(pct * 10) / 10)}%`;
  return { first, last, max, pct, pctText, n: pts.length };
}

function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function weekInfo() {
  const meta = Math.max(1, +state.plan.metaSemanal || 4);
  const counts = {};
  for (const s of state.sessions) { const k = isoOf(weekStart(parseISO(s.data))); counts[k] = (counts[k] || 0) + 1; }
  const cur = weekStart(parseISO(todayISO()));
  const now = counts[isoOf(cur)] || 0;
  let streak = now >= meta ? 1 : 0;
  const w = new Date(cur); w.setDate(w.getDate() - 7);
  while ((counts[isoOf(w)] || 0) >= meta) { streak++; w.setDate(w.getDate() - 7); }
  return { meta, now, streak };
}
function prSet() {
  const best = {}, out = new Set();
  for (const s of sortedSessions()) for (const [id, it] of Object.entries(s.itens || {})) {
    if (!it || it.carga == null) continue;
    if (best[id] != null && it.carga > best[id]) out.add(s.id + '|' + id);
    if (best[id] == null || it.carga > best[id]) best[id] = it.carga;
  }
  return out;
}
const fmtDur = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${pad2(m % 60)} min`;

const corpoSorted = () => state.corpo.slice().sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
const corpoPts = () => corpoSorted().map(x => ({ data: x.data, v: x.kg }));
function weekCard() {
  const w = weekInfo();
  let bars = ''; for (let i = 0; i < w.meta; i++) bars += `<span class="${i < w.now ? 'on' : ''}"></span>`;
  const msg = w.now >= w.meta ? 'Meta da semana batida' : `Falta${w.meta - w.now > 1 ? 'm' : ''} ${w.meta - w.now} para a meta`;

}

function ytInfo(url) {
  try {
    const u = new URL(String(url).trim());
    const h = u.hostname.replace(/^(www|m)\./, '');
    let id = null, tall = false;
    if (h === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com' || h === 'music.youtube.com') {
      const parts = u.pathname.split('/');
      if (parts[1] === 'shorts') { id = parts[2]; tall = true; }
      else if (parts[1] === 'embed' || parts[1] === 'live') id = parts[2];
      else id = u.searchParams.get('v');
    }
    return id && /^[\w-]{6,20}$/.test(id) ? { id, tall } : null;
  } catch (e) { return null; }
}
const VDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) { rej(new Error('sem IndexedDB')); return; }
      const r = indexedDB.open('meus-treinos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('videos');
      r.onsuccess = () => { this.db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('videos', mode), req = fn(t.objectStore('videos'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.run('readonly', st => st.get(k)); },
  put(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  del(k) { return this.run('readwrite', st => st.delete(k)); },
  keys() { return this.run('readonly', st => st.getAllKeys()); }
};

function calendarCard(ss) {
  const today = todayISO();
  const base = state.calMonth ? parseISO(state.calMonth + '-01') : parseISO(today);
  const y = base.getFullYear(), m = base.getMonth();
  const prefix = `${y}-${pad2(m + 1)}-`;
  const daysIn = new Date(y, m + 1, 0).getDate();
  const byDay = {};
  for (const s of ss) if (s.data.startsWith(prefix)) (byDay[s.data] = byDay[s.data] || []).push(s);
  let cells = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(w => `<span class="calwd" aria-hidden="true">${w}</span>`).join('');
  for (let i = 0; i < new Date(y, m, 1).getDay(); i++) cells += '<span class="calday out" aria-hidden="true"></span>';
  for (let dd = 1; dd <= daysIn; dd++) {
    const iso = prefix + pad2(dd), list = (byDay[iso] || []).slice().reverse();
    const cls = `calday${iso === today ? ' today' : ''}${list.length ? ' has' : ''}`;
    if (list.length) {
      const badges = list.slice(0, 2).map(s => `<span class="calb" style="${tv(s.treino)}">${esc(s.treino)}</span>`).join('');
      cells += `<button type="button" class="${cls}" data-action="cal-day" data-d="${iso}" aria-pressed="${state.calDay === iso}" aria-label="${dd} de ${MESES[m]}: ${esc(list.map(s => 'Treino ' + s.treino).join(', '))}">${dd}<span class="caldots">${badges}</span></button>`;
    } else cells += `<span class="${cls}">${dd}</span>`;
  }
  const monthList = Object.values(byDay).flat();
  const per = {}; monthList.forEach(s => { per[s.treino] = (per[s.treino] || 0) + 1; });
  const atEnd = `${y}-${pad2(m + 1)}` >= today.slice(0, 7);
  return `<div class="card cal">
    <div class="calhead"><button type="button" class="calnav" data-action="cal-prev" aria-label="Mês anterior">‹</button><h2>${MESES[m]} ${y}</h2><button type="button" class="calnav" data-action="cal-next" aria-label="Próximo mês"${atEnd ? ' disabled' : ''}>›</button></div>
    <div class="calgrid">${cells}</div>
    <div class="calfoot"><b style="color:var(--ink)">${monthList.length} ${monthList.length === 1 ? 'treino' : 'treinos'} no mês</b>${state.plan.treinos.map(t => per[t.id] ? `<span class="k" style="${tv(t.id)}"><i></i>${esc(t.id)} · ${per[t.id]}</span>` : '').join('')}</div>
  </div>`;
}
function shiftMonth(k) {

  const d = new Date(b.getFullYear(), b.getMonth() + k, 1);
  const ym = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  if (ym > todayISO().slice(0, 7)) return;
  state.calMonth = ym; state.calDay = null; render();
}
function viewHistorico() {
  const ss = sortedSessions().reverse();
  const souAluno = isCloud() && canLog() && state.role !== 'personal';
  const recadosGeral = souAluno ? `<h3 class="sec">Recados com o seu personal</h3><div class="card">${thread(state.ctx, '')}</div>` : '';

  const w = weekInfo();
  const durs = ss.slice(0, 20).map(s => s.duracaoMin).filter(v => v > 0);
  const avgDur = durs.length ? Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) : null;
  let html = calendarCard(ss);
  html += `<div class="card" style="margin-top:10px"><div class="sumgrid">
    <div class="stat"><small>Esta semana</small><b>${w.now} de ${w.meta}</b></div>
    <div class="stat"><small>Sequência</small><b>${w.streak} ${w.streak === 1 ? 'semana' : 'semanas'}</b></div>
    <div class="stat"><small>Total</small><b>${ss.length} ${ss.length === 1 ? 'treino' : 'treinos'}</b></div>
    <div class="stat"><small>Duração média</small><b>${avgDur ? fmtDur(avgDur) : '—'}</b></div></div></div>`;
  html += recadosGeral;
  if (!isCloud()) {
    const dsb = daysSinceBackup();
    if (ss.length >= 4 && (dsb == null || dsb >= 14)) html += `<div class="card row gap" style="margin-top:10px"><p class="small grow">${dsb == null ? 'Você ainda não fez backup.' : `Último backup há ${dsb} dias.`} Seus treinos ficam só neste celular.</p><button type="button" class="btn sm" data-action="backup">Baixar backup</button></div>`;
  }
  const list = state.calDay ? ss.filter(s => s.data === state.calDay) : ss;
  if (state.calDay) html += `<div class="row between" style="margin:22px 0 8px"><h3 class="sec" style="margin:0">Treino de ${esc(fmtDia(state.calDay))}</h3><button type="button" class="btn sm" data-action="cal-clear">Ver todos</button></div>`;
  const prs = prSet();
  let month = '';
  for (const s of list) {
    const d = parseISO(s.data), mm = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
    if (!state.calDay && mm !== month) { html += `<h3 class="sec">${esc(mm)}</h3>`; month = mm; }
    const t = treinoById(s.treino);
    const ids = Object.keys(s.itens || {});
    const nPR = ids.filter(id => prs.has(s.id + '|' + id)).length;
    const nc = isCloud() ? (cache(state.ctx).comentarios || []).filter(m => m.sessao_id === s.id).length : 0;
    const open = state.openSess === s.id || (!!state.calDay && list.length === 1);
    html += `<article class="hcard" style="${tv(s.treino)};margin-bottom:8px">
      <button type="button" class="hrow" data-action="toggle-sess" data-id="${esc(s.id)}" aria-expanded="${open}">
        <span class="hl">${esc(s.treino)}</span>
        <span class="grow"><b>${esc(fmtDia(s.data))}${nPR ? `<span class="pill">${nPR} ${nPR === 1 ? 'recorde' : 'recordes'}</span>` : ''}</b><small>${esc(t ? t.nome : 'Treino ' + s.treino)} · ${ids.length} ${ids.length === 1 ? 'exercício' : 'exercícios'}${s.duracaoMin ? ' · ' + fmtDur(s.duracaoMin) : ''}${nc ? ` · ${nc} ${nc === 1 ? 'comentário' : 'comentários'}` : ''}</small></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      ${open ? `<div class="hbody">
        ${ids.length ? `<div class="tscroll"><table class="t"><thead><tr><th>Exercício</th><th class="n">Carga</th><th class="n">Séries</th></tr></thead><tbody>${ids.map(id => {
          const it = s.itens[id], fx = findEx(id);
          const nome = fx ? fx.e.nome : ((s.nomes && s.nomes[id]) || 'Exercício removido');
          return `<tr><td>${esc(nome)}${prs.has(s.id + '|' + id) ? '<span class="pill">Recorde</span>' : ''}${it.obs ? `<div class="obs">${esc(it.obs)}</div>` : ''}</td><td class="n">${esc(fmtCarga(it.carga, fx ? fx.e.unidade : 'kg'))}${Array.isArray(it.cargas) ? `<div class="obs">${esc(fmtSets(it.cargas))}</div>` : ''}</td><td class="n">${it.feitas || 0}/${it.total || Math.max(it.feitas || 0, fx ? nSeries(fx.e) : 0)}</td></tr>`;
        }).join('')}</tbody></table></div>` : '<p class="muted small">Sem cargas registradas.</p>'}
        ${s.nota ? `<p class="small"><b>Anotação:</b> ${esc(s.nota)}</p>` : ''}
        ${canLog() ? `<div class="row gap"><button type="button" class="btn sm" data-action="edit-sess" data-id="${esc(s.id)}">Editar</button><button type="button" class="btn sm danger" data-action="del-sess" data-id="${esc(s.id)}">Excluir</button></div>` : ''}
        ${isCloud() ? `<div class="vsec"><b class="small">Comentários</b>${thread(state.ctx, s.id)}</div>` : ''}
      </div>` : ''}
    </article>`;
  }
  return html;
}

function evoTreinoDefault() {
  if (state.evo.treino && treinoById(state.evo.treino)) return state.evo.treino;
  const ss = sortedSessions();
  if (ss.length && treinoById(ss[ss.length - 1].treino)) return ss[ss.length - 1].treino;
  return state.plan.treinos[0].id;
}

function viewEvolucao() {
  const withAv = isCloud() && state.view !== 'aluno';
  if (!withAv && state.evoMode === 'avaliacoes') state.evoMode = 'cargas';
  const opts = [['cargas', 'Cargas'], ['corpo', 'Peso corporal']].concat(withAv ? [['avaliacoes', 'Avaliações']] : []);
  const seg = `<div class="seg" role="group" aria-label="O que acompanhar" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(([k, l]) => `<button type="button" data-action="evo-mode" data-m="${k}" aria-pressed="${(state.evoMode || 'cargas') === k}">${l}</button>`).join('')}</div>`;
  return seg + (state.evoMode === 'corpo' ? viewCorpo() : state.evoMode === 'avaliacoes' ? viewAvaliacoes(false) : viewCargas());
}
function corpoBoxes(cp) {
  const first = cp[0].v, last = cp[cp.length - 1].v, diff = Math.round((last - first) * 10) / 10;
  return [['Inicial', fmtCarga(first)], ['Atual', fmtCarga(last)], ['Variação', `${diff > 0 ? '+' : ''}${nf.format(diff)} kg`], ['Registros', String(cp.length)]];
}
function viewCorpo() {
  const pts = corpoPts(), last = pts[pts.length - 1];
  let html = `<div class="card stack" style="--t:var(--accent);--t-soft:var(--surface-2)">
    ${canLog() ? `<div class="row gap wrap" style="align-items:flex-end">
      <label class="field" for="bw-date" style="flex:1 1 140px"><span>Data</span><input class="input" type="date" id="bw-date" value="${todayISO()}" max="${todayISO()}"></label>
      <label class="field" for="bw-kg" style="flex:1 1 100px"><span>Peso (kg)</span><input class="input" id="bw-kg" inputmode="decimal" autocomplete="off" placeholder="${last ? esc(nfIn.format(last.v)) : 'Ex.: 82,5'}"></label>
      <button type="button" class="btn primary" data-action="bw-add" style="flex:1 1 100px">Registrar</button>
    </div>` : ''}`;
  if (pts.length) {
    html += `<div class="stats">${corpoBoxes(pts).map(([k, v]) => `<div class="stat"><small>${k}</small><b>${esc(v)}</b></div>`).join('')}</div><div class="chart" id="chart"></div>`;
  } else html += `<p class="muted">${canLog() ? 'Registre seu peso de vez em quando, de preferência no mesmo horário (por exemplo, segunda de manhã), e a linha de evolução aparece aqui.' : 'O aluno ainda não registrou o peso no app.'}</p>`;
  html += `</div>`;
  if (pts.length) {
    const rows = corpoSorted().reverse();
    html += `<div class="row gap wrap" style="margin-top:12px"><button type="button" class="btn primary grow" data-action="pdf-corpo">Exportar PDF do peso corporal</button></div>
    <h3 class="sec">Registros</h3><div class="card tscroll"><table class="t"><thead><tr><th>Data</th><th class="n">Peso</th><th class="n">Diferença</th><th></th></tr></thead><tbody>${rows.map((x, i) => {
      const prev = rows[i + 1], dd = prev ? Math.round((x.kg - prev.kg) * 10) / 10 : null;
      return `<tr><td>${esc(fmtDMY(x.data))}</td><td class="n">${esc(fmtCarga(x.kg))}</td><td class="n muted">${dd == null ? '—' : (dd > 0 ? '+' : '') + esc(nf.format(dd)) + ' kg'}</td><td class="n">${canLog() ? `<button type="button" class="xbtn" data-action="bw-del" data-id="${esc(x.id)}" aria-label="Excluir o peso de ${esc(fmtDMY(x.data))}">✕</button>` : ''}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  }
  return html;
}
function viewCargas() {

  <div class="card stack" style="${tv(tid)};margin-top:12px">
    <div><div class="exname" style="font-size:18px">${esc(e.nome)}</div><div class="presc">${esc(presc(e))} · carga em ${unitLabel(e.unidade)}</div></div>
    ${st ? `<div class="stats">
        <div class="stat"><small>Inicial</small><b>${esc(fmtCarga(st.first, e.unidade))}</b></div>

  }
  html += `<h3 class="sec">Resumo do Treino ${esc(tid)}</h3><div class="stack" style="${tv(tid)}">${exs.map(x => {

  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const cp = corpoPts(), rows = corpoSorted();
  let y = pdfHeader(doc, 'Peso corporal', `Gerado em ${fmtDMY(todayISO())} · ${cp.length} registros de ${fmtDMY(cp[0].data)} a ${fmtDMY(cp[cp.length - 1].data)}`);
  y = pdfBoxes(doc, corpoBoxes(cp), 16, y, 178, 17) + 6;
  pdfChart(doc, cp, 'kg', PDF_SAGE, 16, y, 178, 82); y += 92;
  const head = () => {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(110, 116, 128);
    doc.text('DATA', 16, y); doc.text('PESO', 74, y, { align: 'right' }); doc.text('DIFERENÇA', 110, y, { align: 'right' });
    y += 2; doc.setDrawColor(222, 226, 233); doc.setLineWidth(0.2); doc.line(16, y, 194, y); y += 5;
  };
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(46, 54, 49); doc.text('Registros', 16, y); y += 7;
  head();
  rows.forEach((x, i) => {
    if (y + 6.5 > 280) { doc.addPage(); y = 20; head(); }
    const prev = rows[i - 1], dd = prev ? Math.round((x.kg - prev.kg) * 10) / 10 : null;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(46, 54, 49);
    doc.text(fmtDMY(x.data), 16, y); doc.text(fmtCarga(x.kg), 74, y, { align: 'right' });
    doc.setTextColor(90, 98, 114); doc.text(dd == null ? '-' : `${dd > 0 ? '+' : ''}${nf.format(dd)} kg`, 110, y, { align: 'right' });
    y += 3; doc.setDrawColor(236, 238, 242); doc.line(16, y, 194, y); y += 4.5;
  });
  pdfFooter(doc);
  return doc;
}

}

/* Fila de envio: tudo que muda vai para cá e é enviado quando houver internet */
const outbox = () => LS.get('c:outbox', []);
function enqueue(op) {
  op.ts = Date.now() + Math.random();
  const q = outbox().filter(x => x.k !== op.k);
  q.push(op); LS.set('c:outbox', q);
  renderChrome(); flushSoon();
}
let flushing = false, flushT;
function flushSoon() { clearTimeout(flushT); flushT = setTimeout(flush, 250); }
async function flush() {
  if (!isCloud() || flushing || !state.user) return;
  flushing = true;
  let sent = 0;
  try {
    for (;;) {
      const q = outbox();
      if (!q.length) break;
      const op = q[0];
      try {
        if (op.op === 'upsert') await api.upsert(op.t, op.row);
        else if (op.op === 'insert') await api.inserir(op.t, op.row);
        else await api.remove(op.t, op.id);
        sent++;
      } catch (e) {
        if (isNetErr(e)) { state.syncErr = 'offline'; break; }
        toast('Não consegui salvar uma alteração: ' + errText(e));
      }
      LS.set('c:outbox', outbox().filter(x => !(x.k === op.k && x.ts === op.ts)));
      if (op.t === 'comentarios' && op.op === 'insert') { const m = (cache(op.aluno).comentarios || []).find(x => x.id === op.id); if (m) delete m.pendente; }
    }
    if (!outbox().length) state.syncErr = '';
  } finally { flushing = false; renderChrome(); if (sent) render(); }
}
function overlay(t, alunoId, rows) {
  let out = rows.slice();
  for (const o of outbox()) {
    if (o.t !== t || o.aluno !== alunoId) continue;
    out = out.filter(r => r.id !== o.id);
    if (o.op !== 'delete' && o.local) out.push(o.local);
  }
  return out;
}
const rowToSess = r => Object.assign({}, r.dados || {}, { id: r.id, data: r.data, treino: r.treino });

async function pull(alunoId) {
  const d = await api.dadosAluno(alunoId);
  const c = cache(alunoId);
  if (!outbox().some(o => o.t === 'fichas' && o.aluno === alunoId)) c.plan = d.ficha ? normalizePlan(d.ficha.plano) : null;
  c.planAt = d.ficha ? d.ficha.atualizado_em : null;
  c.sessions = overlay('sessoes', alunoId, (d.sessoes || []).map(rowToSess));
  c.corpo = overlay('corpo', alunoId, (d.corpo || []).map(r => ({ id: r.id, data: r.data, kg: Number(r.kg) })));
  c.corpoPrev = corpoMap(c.corpo);
  c.avaliacoes = d.avaliacoes || [];
  c.comentarios = overlay('comentarios', alunoId, d.comentarios || []);
  c.loaded = true; c.at = Date.now();
  if (state.ctx === alunoId) { setCtx(alunoId); saveCtxCache(); }
}

async function compressImage(file, max = 1400, q = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(res, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}

function bump(b, dir) {

}

    toast(fails ? `Backup importado com ${fails} falhas ao salvar na conta` : 'Backup importado');
  }
});

function readHash() {
  const h = location.hash.replace('#', '');
  const A = ['treino', 'historico', 'evolucao', 'ficha'], P = ['alunos', 'aluno', 'recados', 'conta'];
  if (!isCloud()) { state.view = A.includes(h) ? h : 'treino'; return; }
  if (grabConvite() && state.user && state.role === 'aluno' && !state.me) { state.view = 'convite'; return; }
  if (!state.user) { state.view = state.view === 'carregando' ? 'carregando' : 'login'; return; }
  if (state.role === 'admin') { state.env = 'admin'; state.view = ['admin', 'conta'].includes(h) ? h : 'admin'; return; }
  if (state.role !== 'personal' && !state.me) { state.view = 'convite'; return; }
  if (state.role === 'personal') { if (P.includes(h)) state.env = 'personal'; else if (A.includes(h)) state.env = 'aluno'; }
  else state.env = 'aluno';
  const allowed = state.env === 'personal' ? P : A;
  state.view = allowed.includes(h) ? h : allowed[0];
  if (state.view === 'aluno' && !state.alunos.some(a => a.id === state.alunoSel)) state.view = 'alunos';
  if (state.env === 'aluno' && state.me && state.ctx !== state.me.id) setCtx(state.me.id);
  if (state.view !== 'aluno') state.editPlan = state.env === 'aluno' ? state.editPlan : null;
}
window.addEventListener('hashchange', () => { readHash(); render(); window.scrollTo(0, 0); });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}

ntfyCancel();
VDB.keys().then(ks => { if (ks && ks.length) { state.vids = new Set(ks); render(); } }).catch(() => {});
if (window.AXIS_TEST_API) window.__axis = { state, timer, startTimer, stopTimer };
swAtualizar();
if (CLOUD_ON) { bootCloud(); initStore(); }
else {
  readHash();
  if (state.draft && !location.hash) state.view = 'treino';
  render();
  initStore();
}
})();
</script>
